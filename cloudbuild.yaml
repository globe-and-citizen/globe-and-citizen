steps:
  - name: node:20
    entrypoint: npm
    args: ["install"]

  - name: node:20
    entrypoint: npm
    args: ["run", "build"]
    secretEnv:
      - VITE_LAYER8_ENABLED
      - VITE_API_BASE_URL
      - VITE_FORWARD_PROXY_URL
      - VITE_LAYER8_BASE_URL_PROD
      - VITE_LAYER8_BASE_URL_DEV
      - VITE_APP_VERSION
      - VITE_OTEL_ENABLED
      - VITE_OTEL_COLLECTOR_URL
      - VITE_OTEL_PROPAGATE_URLS
      - VITE_SERVICE_NAME
    # env:
    #   - "VITE_API_BASE_URL=$$VITE_API_BASE_URL"
    #   - "VITE_FORWARD_PROXY_URL=$$VITE_FORWARD_PROXY_URL"
    #   - "VITE_LAYER8_BASE_URL_PROD=$$VITE_LAYER8_BASE_URL_PROD"

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gsutil
    args: ["-m", "rsync", "-r", "dist/", "gs://globeandcitizen.com"]

availableSecrets:
  secretManager:
    - versionName: projects/gc-now-471214/secrets/_VITE_API_BASE_URL/versions/latest
      env: VITE_API_BASE_URL
    - versionName: projects/gc-now-471214/secrets/_VITE_FORWARD_PROXY_URL/versions/latest
      env: VITE_FORWARD_PROXY_URL
    - versionName: projects/gc-now-471214/secrets/_VITE_LAYER8_BASE_URL_PROD/versions/latest
      env: VITE_LAYER8_BASE_URL_PROD
    - versionName: projects/1865275255/secrets/_VITE_OTEL_COLLECTOR_URL/versions/latest
      env: VITE_OTEL_COLLECTOR_URL
    - versionName: projects/1865275255/secrets/_VITE_OTEL_PROPAGATE_URLS/versions/latest
      env: VITE_OTEL_PROPAGATE_URLS
    - versionName: projects/1865275255/secrets/_VITE_APP_VERSION/versions/latest
      env: VITE_APP_VERSION
    - versionName: projects/1865275255/secrets/_VITE_LAYER8_ENABLED/versions/latest
      env: VITE_LAYER8_ENABLED
    - versionName: projects/1865275255/secrets/_VITE_LAYER8_BASE_URL_DEV/versions/latest
      env: VITE_LAYER8_BASE_URL_DEV
    - versionName: projects/1865275255/secrets/_VITE_OTEL_ENABLED/versions/latest
      env: VITE_OTEL_ENABLED
    - versionName: projects/1865275255/secrets/_VITE_SERVICE_NAME/versions/latest
      env: VITE_SERVICE_NAME

options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
