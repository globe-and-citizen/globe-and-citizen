steps:
  # Install dependencies
  - name: node:20
    entrypoint: npm
    args: ["install"]

  # Build frontend
  - name: node:20
    entrypoint: npm
    args: ["run", "build"]
    env:
      - "VITE_API_BASE_URL=$_VITE_API_BASE_URL"
      - "VITE_FORWARD_PROXY_URL=$_VITE_FORWARD_PROXY_URL"
      - "VITE_LAYER8_BASE_URL_PROD=$_VITE_LAYER8_BASE_URL_PROD"
      - "VITE_LAYER8_ENABLED=$_VITE_LAYER8_ENABLED"
      - "VITE_OTEL_ENABLED=$_VITE_OTEL_ENABLED"
      - "VITE_OTEL_COLLECTOR_URL=$_VITE_OTEL_COLLECTOR_URL"
      - "VITE_OTEL_PROPAGATE_URLS=$_VITE_OTEL_PROPAGATE_URLS"

  # Deploy to Cloud Storage
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gsutil
    args: ["-m", "rsync", "-r", "dist/", "gs://l8.globeandcitizen.com"]

options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
